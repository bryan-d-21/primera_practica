<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gradient">
      <header>
        <h1>Nexus Cómics</h1>
        <div id="contact">
          <div class="location">
            <img src="ubicacion.png" alt="ubicación" />
            <p>Calle Krypton, nº 23</p>
          </div>
          <div class="tel">
            <img src="telefono.png" alt="teléfono" />
            <p>
              <span>8 (812) 844-95-49</span> Disponibilidad de 9:00 a 20:00
            </p>
          </div>
        </div>
      </header>
      <div id="hero">
        <div>
          <button>Novedades</button>
          <h2>Los mejores cómics y figuras de la galaxia</h2>
          <p>
            Cada semana, lo último de Marvel, DC y Star Wars: cómics de
            colección, figuras y merchandising geek con envío a toda España.
          </p>
          <div>
            <button>Ver catálogo</button>
            <p>Envío gratis en tu primera compra</p>
          </div>
        </div>
        <img src="comics.jpg" alt="superhéroes" />
      </div>
    </div>
  </body>
</html>
